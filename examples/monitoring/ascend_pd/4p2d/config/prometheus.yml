global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
- alerts.yml
- request-lengths.rules.yml
scrape_configs:
- job_name: llm-pd
  honor_labels: false
  metrics_path: /metrics
  static_configs:
  - targets:
    - 10.0.0.16:19100
    labels:
      cluster: glm53-910b
      node: 910b-16
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.28:19100
    labels:
      cluster: glm53-910b
      node: 910b-28
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.17:19100
    labels:
      cluster: glm53-910b
      node: 910b-17
      role: decode
      service_id: decode-0
  - targets:
    - 10.0.0.27:19100
    labels:
      cluster: glm53-910b
      node: 910b-27
      role: decode
      service_id: decode-0
  - targets:
    - 10.0.0.25:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-25
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.26:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-26
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.29:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-29
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.30:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-30
      role: prefill
      service_id: prefill-0
  - targets:
    - 10.0.0.31:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-31
      role: decode
      service_id: decode-0
  - targets:
    - 10.0.0.32:19100
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-32
      role: decode
      service_id: decode-0
  metric_relabel_configs: &id001
  - source_labels:
    - model_name
    regex: /models/([^/]+)
    target_label: model_name
    replacement: $1
    action: replace
- job_name: llm-gateway
  honor_labels: false
  metrics_path: /metrics
  metric_relabel_configs: *id001
  static_configs:
  - targets:
    - 10.0.0.16:29266
    labels:
      cluster: glm53-910b
      node: 910b-16
      role: gateway
      service_id: gateway-0
  - targets:
    - 10.0.0.25:29266
    labels:
      cluster: glm53-910b-4p2d
      node: 910b-25
      role: gateway
      service_id: gateway-0
