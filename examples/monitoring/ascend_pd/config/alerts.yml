# Generated by monitoring/dashboard/build.py; edit the generator, then rebuild.
groups:
- name: glm53-pd-recording
  interval: 5s
  rules:
  - record: llm_pd:expected_local_dp_ranks
    expr: (count by (cluster, node, role, service_id) (up{job="llm-pd",cluster="glm53-910b",node="910b-16"}) * 1) or (count
      by (cluster, node, role, service_id) (up{job="llm-pd",cluster="glm53-910b",node="910b-28"}) * 1) or (count by (cluster,
      node, role, service_id) (up{job="llm-pd",cluster="glm53-910b",node="910b-17"}) * 4) or (count by (cluster, node, role,
      service_id) (up{job="llm-pd",cluster="glm53-910b",node="910b-27"}) * 4)
  - record: llm_pd:expected_dp_ranks
    expr: sum by (cluster, role, service_id) (llm_pd:expected_local_dp_ranks)
  - record: llm_pd:dp_snapshot_age_seconds
    expr: max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_snapshot_age_seconds{job="llm-pd"}) and on
      (cluster, node, role, service_id) (up{job="llm-pd"} == 1)
  - record: llm_pd:dp_fresh
    expr: (llm_pd:dp_snapshot_age_seconds < bool 30) and (llm_pd:dp_snapshot_age_seconds >= 0)
  - record: llm_pd:observed_local_dp_ranks
    expr: count by (cluster, node, role, service_id) (count by (cluster, node, role, service_id, dp_rank) (llm_pd:dp_fresh
      == 1))
  - record: llm_pd:observed_dp_ranks
    expr: count by (cluster, role, service_id) (count by (cluster, role, service_id, dp_rank) (llm_pd:dp_fresh == 1))
  - record: llm_pd:coverage_ratio
    expr: llm_pd:observed_dp_ranks / on (cluster, role, service_id) llm_pd:expected_dp_ranks
  - record: llm_pd:service_complete
    expr: llm_pd:observed_dp_ranks == on (cluster, role, service_id) llm_pd:expected_dp_ranks
  - record: llm_pd:running_requests
    expr: max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_running_requests{job="llm-pd"}) and on (cluster,
      model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)
  - record: llm_pd:queue_requests
    expr: max by (cluster, model_name, role, service_id, node, dp_rank, stage) (llm_pd_queue_requests{job="llm-pd"}) and on
      (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)
  - record: llm_pd:kv_tokens_available_ratio
    expr: (max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_kv_tokens{job="llm-pd",state="available"})
      and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) / ((max by (cluster, model_name,
      role, service_id, node, dp_rank) (llm_pd_kv_tokens{job="llm-pd",state="total"}) and on (cluster, model_name, role, service_id,
      node, dp_rank) (llm_pd:dp_fresh == 1)) > 0)
  - record: llm_pd:kv_tokens_evictable_ratio
    expr: (max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_kv_tokens{job="llm-pd",state="evictable"})
      and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) / ((max by (cluster, model_name,
      role, service_id, node, dp_rank) (llm_pd_kv_tokens{job="llm-pd",state="total"}) and on (cluster, model_name, role, service_id,
      node, dp_rank) (llm_pd:dp_fresh == 1)) > 0)
  - record: llm_pd:mamba_slots_available_ratio
    expr: (max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_mamba_slots{job="llm-pd",state="available"})
      and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) / ((max by (cluster, model_name,
      role, service_id, node, dp_rank) (llm_pd_mamba_slots{job="llm-pd",state="total"}) and on (cluster, model_name, role,
      service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) > 0)
  - record: llm_pd:mamba_slots_evictable_ratio
    expr: (max by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_mamba_slots{job="llm-pd",state="evictable"})
      and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) / ((max by (cluster, model_name,
      role, service_id, node, dp_rank) (llm_pd_mamba_slots{job="llm-pd",state="total"}) and on (cluster, model_name, role,
      service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) > 0)
- name: glm53-pd-local-alerts
  interval: 5s
  rules:
  - alert: LLMTargetDown
    expr: up{cluster="glm53-910b",job=~"llm-pd|llm-gateway"} == 0
    for: 30s
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Exporter scrape failed on {{ $labels.node }}
      description: Inspect the target and scrape error locally. Missing metrics are unavailable, not idle.
  - alert: LLMDPCoverageIncomplete
    expr: llm_pd:expected_local_dp_ranks unless on (cluster, node, role, service_id) (llm_pd:observed_local_dp_ranks == on
      (cluster, node, role, service_id) llm_pd:expected_local_dp_ranks)
    for: 1m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Fresh DP coverage incomplete on {{ $labels.node }}
      description: Expected P1 or D4 per node (P2/D8 globally). Missing or stale rank snapshots suppress service totals.
  - alert: LLMGlobalDPCoverageIncomplete
    expr: llm_pd:expected_dp_ranks unless on (cluster, role, service_id) llm_pd:service_complete
    for: 1m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Logical {{ $labels.role }} instance DP coverage incomplete
      description: 'Check global DP identities: P ranks 0..1 and D ranks 0..7 across both machines.'
  - alert: LLMDPSnapshotStale
    expr: llm_pd:dp_snapshot_age_seconds >= 30
    for: 30s
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: DP snapshot stale on {{ $labels.node }} rank {{ $labels.dp_rank }}
      description: The exporter is reachable but its scheduler snapshot is at least 30 seconds old.
  - alert: LLMCollectorUnavailable
    expr: (llm_pd_metric_available{job="llm-pd"} == 0) and on (cluster, model_name, role, service_id, node, dp_rank) (max
      by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_requests_total{job="llm-pd",event="received"}) > 0)
    for: 2m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: 'Collector group unavailable: {{ $labels.metric_group }} on {{ $labels.node }}'
      description: Zero is an explicit availability flag. Absent groups remain NA on the dashboard.
  - alert: LLMCollectorHealthMissing
    expr: (up{job="llm-pd"} == 1) unless on (cluster, node, role, service_id) llm_pd_metric_available{job="llm-pd"}
    for: 2m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Exporter has no collector availability flags on {{ $labels.node }}
      description: HTTP scrape success does not prove source collection is healthy.
  - alert: LLMDuplicateDPTelemetry
    expr: count by (cluster, model_name, role, service_id, node, dp_rank) (llm_pd_running_requests{job="llm-pd"}) > 1
    for: 1m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Repeated TP/EP telemetry for DP {{ $labels.dp_rank }} on {{ $labels.node }}
      description: The exporter must publish once per attention DP leader. Dashboard max deduplicates copies before sum.
  - alert: LLMDPRankIdentityCollision
    expr: count by (cluster, role, service_id, dp_rank) (count by (cluster, node, role, service_id, dp_rank) (llm_pd:dp_snapshot_age_seconds))
      > 1
    for: 1m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: DP rank {{ $labels.dp_rank }} appears on multiple nodes
      description: dp_rank must be global within the logical service, not a node-local index.
  - alert: LLMExpectedDPContractMismatch
    expr: max by (cluster, node, role, service_id) (llm_pd_expected_local_dp_ranks{job="llm-pd"}) != on (cluster, node, role,
      service_id) llm_pd:expected_local_dp_ranks
    for: 1m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Exporter DP expectation disagrees with inventory on {{ $labels.node }}
      description: Read-only contract expects P1/P1/D4/D4. Reconcile inventory before trusting aggregate panels.
  - alert: LLMKVHeadroomLow
    expr: (llm_pd:kv_tokens_available_ratio < 0.05) and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:kv_tokens_evictable_ratio
      < 0.05) and on (cluster, model_name, role, service_id, node, dp_rank) (sum by (cluster, model_name, role, service_id,
      node, dp_rank) (llm_pd:queue_requests) > 0)
    for: 3m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: KV token headroom low with pending work on {{ $labels.node }} DP {{ $labels.dp_rank }}
      description: Available and evictable fractions are both below 5% with queued work for 3m. Evictable is not added to
        available because pool states may overlap. Missing state telemetry does not fire this rule.
  - alert: LLMMambaHeadroomLow
    expr: (llm_pd:mamba_slots_available_ratio < 0.05) and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:mamba_slots_evictable_ratio
      < 0.05) and on (cluster, model_name, role, service_id, node, dp_rank) (sum by (cluster, model_name, role, service_id,
      node, dp_rank) (llm_pd:queue_requests) > 0)
    for: 3m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Mamba state slot headroom low with pending work on {{ $labels.node }} DP {{ $labels.dp_rank }}
      description: Available and evictable fractions are both below 5% with queued work for 3m. Evictable is not added to
        available because pool states may overlap. Missing state telemetry does not fire this rule.
  - alert: LLMDecodePendingWithoutProgress
    expr: sum by (cluster, model_name, role, service_id) ((llm_pd:queue_requests{stage=~"decode_prealloc|decode_transfer|decode_ready|waiting"}
      > 0)) > 0 and on (cluster, model_name, role, service_id) (sum by (cluster, model_name, role, service_id) (llm_pd:running_requests{role="decode"})
      == 0) and on (cluster, model_name, role, service_id) ((sum by (cluster, model_name, role, service_id) (max by (cluster,
      model_name, role, service_id, node, dp_rank) (rate(llm_pd_requests_total{job="llm-pd",role="decode",event="completed"}[5m]))
      and on (cluster, model_name, role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) == 0) and on (cluster, model_name,
      role, service_id) (count by (cluster, model_name, role, service_id) (max by (cluster, model_name, role, service_id,
      node, dp_rank) (rate(llm_pd_requests_total{job="llm-pd",role="decode",event="completed"}[5m])) and on (cluster, model_name,
      role, service_id, node, dp_rank) (llm_pd:dp_fresh == 1)) == on (cluster, role, service_id) group_left() llm_pd:expected_dp_ranks))
      and on (cluster, model_name, role, service_id) (count by (cluster, model_name, role, service_id) (llm_pd:running_requests{role="decode"})
      == on (cluster, role, service_id) group_left() llm_pd:expected_dp_ranks) and on (cluster, role, service_id) llm_pd:service_complete
    for: 5m
    labels:
      severity: warning
      scope: local-only
    annotations:
      summary: Decode has pending work, no running requests and no completions
      description: Sustained for 5m with complete fresh DP coverage. Check PD transfer and scheduling; no fixed TPOT or utilization
        threshold is assumed.
